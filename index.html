<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at top, #641952, #260021 50%, #090008);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ---------------- COMMON ---------------- */

.page {
    display: none;
    min-height: 100vh;
    padding: 35px 20px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    animation: fadeIn 1s ease;
}

.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: 40px;
    margin-bottom: 18px;
}

h2 {
    margin-bottom: 18px;
}

.subtitle {
    color: #f2d4eb;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.glow {
    color: #ff9de2;

    text-shadow:
        0 0 10px #ff62d2,
        0 0 25px #ff62d2,
        0 0 45px #ff62d2;
}
